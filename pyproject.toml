[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enrich"
version = "0.1.0"
description = "Enrich purl_canonical CSVs with operational-metrics data from deps.dev, ecosyste.ms, GitHub, and Snyk."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "tqdm>=4.66",
]

[project.scripts]
enrich = "enrich.cli:main"

[tool.setuptools.packages.find]
include = ["enrich*"]
